<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✂️ Mavis' Chop Shop ✂️</title>
    <style>
        /* --- ESTÉTICA Y2K / 2000s --- */
        :root {
            --bg-color: #dcdcdc;
            --window-bg: #ffffff;
            --highlight: #ff0099;
            --border-light: #ffffff;
            --border-dark: #808080;
            --text-main: #000000;
        }

        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            image-rendering: pixelated;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" style="font-size:16px"><text y="15">✂️</text></svg>'), auto;
        }

        #room-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('fundoinho.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #room-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 1;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .marquee-container {
            position: absolute;
            top: 0; left: 0; width: 100%;
            background: purple;
            color: white;
            padding: 5px;
            z-index: 10;
            font-size: 14px;
        }

        #mavis-wrapper {
            position: absolute;
            width: 180px;
            height: auto;
            z-index: 5;
            transition: top 1s, left 1s;
            cursor: pointer;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5));
        }

        #mavis-img {
            width: 100%;
            height: auto;
            display: block;
            mix-blend-mode: multiply; 
        }

        #cut-overlay {
            position: absolute;
            width: 60px;
            height: 60px;
            top: 45%; left: 23%;
            object-fit: contain;
            display: none;
            z-index: 6;
            border: 1px dashed red;
            background: rgba(255, 255, 255, 0.8);
        }

        #result-overlay {
            position: absolute;
            width: 80px;
            height: 80px;
            top: 35%; left: 20%;
            display: none;
            z-index: 7;
            transform: rotate(-10deg);
            border: 2px solid #fff;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .speech-bubble {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 2px solid #000;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            white-space: normal;
            min-width: 160px;
            text-align: center;
            display: none;
            z-index: 20;
            box-shadow: 3px 3px 0px #000;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px; left: 50%;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #000 transparent;
            display: block;
            width: 0;
        }

        #file-input { display: none; }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shaking {
            animation: shake 0.5s infinite;
        }

        .credits {
            position: absolute;
            bottom: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 20px; 
            border: 3px double #000;
            font-size: 10px; 
            line-height: 1.6;
            color: #000;
            z-index: 100;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
            max-width: 280px;
        }
        .credits .mavis-tag {
            display: block;
            margin-top: 5px;
            font-weight: bold;
            text-transform: uppercase;
            color: rgb(170, 0, 255);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <marquee scrollamount="10">*** BEM-VINDE AO ATELIÊ DA MAVIS *** CORTE SUAS IMAGENS *** UMA HOMENAGEM A NOSSA PEQUENA ANJINHA *** PYTHON POWERED ***</marquee>
    </div>

    <div id="room-container">
        <div id="mavis-wrapper" onclick="handleMavisClick()">
            <div id="message-box" class="speech-bubble">Clique em mim para cortar!</div>
            <img id="mavis-img" src="mavis segurando tesoura.png" alt="Mavis a gata">
            <img id="cut-overlay" alt="Cortando...">
            <img id="result-overlay" alt="Resultado">
        </div>

        <div class="credits">
            Design: <strong>Y2K Aesthetic</strong><br>
            Dev: <strong>Flask + Python</strong><br>
            By: <strong>Lilian Chaves</strong>
            <span class="mavis-tag">Never Forget Mavis</span>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp">

    <script>
        const assets = {
            idle: 'mavis segurando tesoura.png',
            cut1: 'cortando imagem 1.png',
            cut2: 'segurando tesoura 2 (2).png',
            success: 'segura sorrindo.png'
        };
        const mavisSpots = [
            { name: "na janela", top: "6%", left: "69%", flipped: true},
            { name: "no sofá", top: "55%", left: "8%", flipped: true },
            { name: "na mansão", top: "15%", left: "48%"},
            { name: "do lado da caixa", top: "60%", left: "78%" }
        ];

        let state = 'IDLE';
        let uploadedImageSrc = null;
        let processedImageUrl = null;

        const mavisWrapper = document.getElementById('mavis-wrapper');
        const mavisImg = document.getElementById('mavis-img');
        const fileInput = document.getElementById('file-input');
        const cutOverlay = document.getElementById('cut-overlay');
        const resultOverlay = document.getElementById('result-overlay');
        const messageBox = document.getElementById('message-box');

        // URL DO SEU BACKEND NO RENDER
        const BACKEND_URL = 'https://mavis-chop-shop-backend-1.onrender.com/remove-bg/';

        function setRandomPosition() {
            const randomIndex = Math.floor(Math.random() * mavisSpots.length);
            const spot = mavisSpots[randomIndex];

            mavisWrapper.style.top = spot.top;
            mavisWrapper.style.left = spot.left;

            if (spot.flipped) {
                mavisWrapper.style.transform = "scaleX(-1)";
                messageBox.style.transform = "translateX(-50%) scaleX(-1)";
            } else {
                mavisWrapper.style.transform = "scaleX(1)";
                messageBox.style.transform = "translateX(-50%) scaleX(1)";
            }
            
            showMessage("Clique em mim para cortar!", 4000);
        }

        function showMessage(text, duration = 4000) {
            messageBox.innerText = text;
            messageBox.style.display = 'block';
            setTimeout(() => {
                if (state !== 'CUTTING') {
                    messageBox.style.display = 'none';
                }
            }, duration);
        }

        function handleMavisClick() {
            if (state === 'IDLE') {
                fileInput.click();
            } else if (state === 'DONE') {
                downloadImage();
            }
        }

        fileInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageSrc = event.target.result;
                    startCuttingAnimation();
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        function startCuttingAnimation() {
            state = 'CUTTING';
            showMessage("Acordando a Mavis no servidor... Pode levar até 40s se ela estiver dormindo!", 15000);

            cutOverlay.src = uploadedImageSrc;
            cutOverlay.style.display = 'block';
            cutOverlay.classList.add('shaking');

            let frameToggle = false;
            const animationInterval = setInterval(() => {
                if (state !== 'CUTTING') {
                    clearInterval(animationInterval);
                    return;
                }
                if (frameToggle) {
                    mavisImg.src = assets.cut1;
                    cutOverlay.style.transform = "rotate(5deg)";
                } else {
                    mavisImg.src = assets.cut2;
                    cutOverlay.style.transform = "rotate(-5deg)";
                }
                frameToggle = !frameToggle;
            }, 150);

            sendToBackend()
                .then(blob => {
                    clearInterval(animationInterval);
                    processedImageUrl = URL.createObjectURL(blob);
                    finishCutting();
                })
                .catch(error => {
                    clearInterval(animationInterval);
                    console.error('Erro detalhado:', error);
                    // MOSTRA O ERRO EXATO NA TELA:
                    showMessage("Erro: " + error.message, 8000);
                    resetState();
                });
        }

        // --- 5. ENVIO CORRIGIDO COM FORMDATA ---
        async function sendToBackend() {
            const imageFile = fileInput.files[0];
            
            // Empacota o arquivo corretamente para envio HTTP
            const formData = new FormData();
            formData.append('image', imageFile);

            console.log("Enviando imagem para:", BACKEND_URL);

            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errJson = await response.json().catch(() => ({}));
                throw new Error(errJson.error || `Servidor respondeu com código ${response.status}`);
            }

            return await response.blob();
        }

        function finishCutting() {
            state = 'DONE';
            cutOverlay.style.display = 'none';
            cutOverlay.classList.remove('shaking');
            mavisImg.src = assets.success;
            resultOverlay.src = processedImageUrl; 
            resultOverlay.style.display = 'block';
            showMessage("Pronto! Clique em mim para baixar!", 6000);
        }

        function downloadImage() {
            if (!processedImageUrl) return;

            const link = document.createElement('a');
            link.href = processedImageUrl;
            link.download = 'mavis_sem_fundo.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showMessage("Baixado! Próximo!", 2000);
            setTimeout(resetState, 2000);
        }

        function resetState() {
            state = 'IDLE';
            mavisImg.src = assets.idle;
            resultOverlay.style.display = 'none';
            resultOverlay.src = '';
            fileInput.value = '';
            
            if (processedImageUrl) {
                URL.revokeObjectURL(processedImageUrl);
                processedImageUrl = null;
            }
            uploadedImageSrc = null;
        }

        window.onload = setRandomPosition;
    </script>
</body>
</html>
